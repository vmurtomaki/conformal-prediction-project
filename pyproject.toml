[project]
name = "conformal-prediction-project"
version = "0.1.0"
description = "Enterprise Uncertainty Quantification via Conformal Prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.4.0",
    "mapie>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "altair>=5.2.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.1"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov=app"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true